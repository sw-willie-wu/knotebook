name: CI

on:
  push:
    branches: [master, main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 只有 PR 會取消同一分支較舊的 run。其他（push 到 main 等）每次 run 自成一組：
# 若共用一組，就算不 cancel-in-progress，排隊中的舊 run 仍會被新的取代。main 的每個 push 都要有
# 完整的 CI 結論，release.yml 靠它決定要不要發版。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 測試拆成平行的 job（原本一個 job 跑 `pnpm test`，依 runner 快慢會撞到 30 分鐘上限）：
  #   build-unit：build、型別、lint、授權等檢查，加上 shared、web 與 server 的 unit 測試（test/unit/**）
  #   integration：server 的整合測試（test/*.test.ts，testcontainers 起 PostgreSQL），用 vitest --shard 切 3 片平行跑；
  #     每片是獨立 runner，各自由 globalSetup 起一座 PostgreSQL 容器，互不干擾。三片合起來＝同一組測試檔。
  # 兩邊合起來＝`pnpm test` 跑的同一組測試檔（server：vitest.config.ts 收到的檔＝vitest.unit.config.ts ∪ test/*.test.ts）。
  # main ruleset 要求的 status check 是 `ci`：保留同名 job，兩個 job 都成功它才成功。
  build-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update corepack
        run: npm i -g corepack@latest

      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm (align with packageManager)
        run: corepack prepare pnpm@10.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify apps/web build output (hashed /assets)
        run: |
          test -d apps/web/dist/assets
          ls apps/web/dist/assets | grep -qE '^index-[A-Za-z0-9_-]+\.(js|css)$'

      # issue #19：entry chunk 尺寸上限 + NotePage lazy chunk 存在（防「BlockNote 被
      # 靜態 import 回首包」與「lazy split 被拿掉」兩種迴歸）。
      - name: Check bundle size (entry cap + lazy chunk present)
        run: node scripts/check-bundle-size.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check licenses
        run: pnpm check-licenses

      - name: Verify LICENSE file exists
        run: test -f LICENSE

      - name: Test scripts (check-licenses, check-bundle-size)
        run: pnpm test:scripts

      - name: Test shared
        run: pnpm --filter @knotebook/shared test

      - name: Test web
        run: pnpm --filter @knotebook/web test

      - name: Test server (unit)
        run: pnpm --filter @knotebook/server test:unit

  integration:
    name: integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update corepack
        run: npm i -g corepack@latest

      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm (align with packageManager)
        run: corepack prepare pnpm@10.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 整合測試只需要 shared 編好（test:integration 自己會先 build shared）；testcontainers 用 runner 內建的 docker。
      - name: Test server (integration, shard ${{ matrix.shard }}/3)
        run: pnpm --filter @knotebook/server test:integration --shard=${{ matrix.shard }}/3

  # main ruleset 的 required status check（context `ci`）。`always()`：前面的 job 失敗或取消時也要跑，
  # 才會回報失敗（否則它被 skip，而 skipped 的 required check 會被當成通過）。
  ci:
    needs: [build-unit, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs succeeded
        env:
          BUILD_UNIT: ${{ needs.build-unit.result }}
          INTEGRATION: ${{ needs.integration.result }}  # matrix 彙整：任一片失敗／取消則非 success
        run: |
          echo "build-unit: $BUILD_UNIT, integration: $INTEGRATION"
          test "$BUILD_UNIT" = success && test "$INTEGRATION" = success

  # 此 job 在 PR 上恆 skipped——絕不可加入 main ruleset 的 required checks（加了每個 PR 永遠等不到綠）
  # 觸發＝push main 或手動 dispatch
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update corepack, enable, and prepare pnpm
        run: npm i -g corepack@latest && corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docker compose version
        run: docker compose version

      - name: Start compose stack (e2e overlay)
        run: docker compose -p knotebook-e2e -f docker-compose.yml -f docker-compose.e2e.yml up --build --wait --wait-timeout 300

      - name: Install Playwright browsers
        run: pnpm --filter @knotebook/e2e exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @knotebook/e2e run test:e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -p knotebook-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs > compose-logs.txt

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/test-results/
            compose-logs.txt
