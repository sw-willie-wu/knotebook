services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    # 預設只綁 loopback：public 拓撲（docs/self-hosting.md「Deployment prerequisites」）的假設是
    # app 只透過反代對外曝露；若直接 "3000:3000"（等同 0.0.0.0:3000），docker 會
    # 直接在 iptables 開洞，繞過 host 防火牆規則，讓區網/公網能不經反代直接打到
    # app。Quickstart 的 `curl http://localhost:3000/...` 不受影響（127.0.0.1 對本機
    # 而言就是 localhost）。要用 trusted-LAN plain-http 拓撲，改用下面註解掉的替代寫法。
    ports:
      - "127.0.0.1:3000:3000"
      # LAN mode（trusted-LAN plain-http，見 docs/self-hosting.md「Deployment prerequisites」）：
      # 換成 "3000:3000" 會把 app 直接曝露到你的網段（等同 0.0.0.0:3000），並透過
      # docker 自己在 iptables 開的洞繞過 host 防火牆規則——啟用前務必先讀過
      # docs/self-hosting.md 的風險清單（cleartext 密碼/session cookie、無 Secure flag）。
      # - "3000:3000"
    # Task 9：上傳圖片持久化——不掛 volume 的話，圖片只存在 container 的可寫層，
    # `docker compose down`／重建 container 會整批遺失。掛載點與 Dockerfile 建的
    # `/app/uploads`（已 chown 給 node）一致，`src/index.ts` 用同一個相對路徑
    # （`process.cwd()/uploads`，WORKDIR 為 /app）解析。
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1 而非 localhost：避免容器內 /etc/hosts 或 Node DNS 解析（部分
      # image 的 getaddrinfo 在無 IPv6 時可能先嘗試 ::1）導致的額外延遲/失敗，
      # 明確指定 loopback IPv4 位址。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knotebook
      # 可用 shell/.env 的 POSTGRES_PASSWORD 覆寫預設值；注意 Postgres 只在「第一次
      # 初始化空 data 目錄」時套用這個變數（見 docs/known-limitations.md），事後改這裡
      # 不會自動生效。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knotebook}
      POSTGRES_DB: knotebook
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotebook -d knotebook"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  uploads:
